spring.application.name=ants_ktc
server.port=3333

# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://server.aptech.io:3307/ants
spring.datasource.username=ants_user
spring.datasource.password=ants_password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# spring.web.resources.add-mappings=false

# Static Resources Configuration
spring.web.resources.static-locations=file:public/uploads/
spring.mvc.static-path-pattern=/uploads/**

# File Upload Configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=20MB